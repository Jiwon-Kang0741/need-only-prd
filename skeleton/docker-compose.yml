services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: tomms
      POSTGRES_USER: tomms_user
      POSTGRES_PASSWORD: tomms_pass
    ports:
      - "${DB_PORT:-18000}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tomms_user -d tomms"]
      interval: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/tomms
      SPRING_DATASOURCE_USERNAME: tomms_user
      SPRING_DATASOURCE_PASSWORD: tomms_pass
    ports:
      - "${BACKEND_PORT:-18001}:8080"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-18002}:3000"

volumes:
  dbdata:
